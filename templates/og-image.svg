<!--
  Coaxio OG image template — 1200x630.

  Placeholders, substituted by whatever generates the final image:
    {{TITLE}}     page or post title, up to ~52 characters on one line
    {{KICKER}}    project or section, lowercase, e.g. "coaxio-forge"

  Text is set in Space Grotesk and Inter. If the renderer has no access to
  those faces, convert the text to paths first — the fallback is visibly wrong.
  Colours are literal hex rather than CSS variables because this file is
  consumed outside any stylesheet.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="{{TITLE}}">

  <!-- surface.base -->
  <rect width="1200" height="630" fill="#0E1A1C"/>

  <!-- coax cross-section, low contrast, bled off the right edge -->
  <g transform="translate(1010 315)" fill="none">
    <circle r="290" stroke="#1B3034" stroke-width="1"/>
    <circle r="232" stroke="#1B3034" stroke-width="2"/>
    <circle r="176" stroke="#27474C" stroke-width="1"/>
    <circle r="120" stroke="#27474C" stroke-width="2"/>
    <circle r="64"  stroke="#35666E" stroke-width="1"/>
    <circle r="22"  fill="#884D26" stroke="none"/>
  </g>

  <!-- signal spine: the one bright element -->
  <rect x="88" y="150" width="2" height="330" fill="#8FE3C7"/>

  <!-- kicker -->
  <text x="128" y="196"
        font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="22" letter-spacing="0.44" fill="#6DB0BB">{{KICKER}}</text>

  <!-- title -->
  <text x="128" y="300"
        font-family="Space Grotesk, system-ui, sans-serif"
        font-size="64" font-weight="600" letter-spacing="-1.9" fill="#F4F8F9">{{TITLE}}</text>

  <!-- tagline -->
  <text x="128" y="366"
        font-family="Inter, system-ui, sans-serif"
        font-size="26" fill="#C6DDE1">Day-zero scaffolding for homelab infrastructure</text>

  <!-- wordmark and domain -->
  <text x="128" y="466"
        font-family="Space Grotesk, system-ui, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.6" fill="#E0955F">Coaxio</text>
  <text x="238" y="466"
        font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="20" fill="#478E9A">coaxio.dev</text>

</svg>
